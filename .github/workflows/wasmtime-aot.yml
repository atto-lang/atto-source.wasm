name: Wasmtime separate AOT builder and compiler-free runner
on:
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/aot-smoke.sh'
      - '.github/workflows/wasmtime-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check trusted Rust toolchain availability
        run: rustc --version && cargo --version
      - name: Install LLVM WebAssembly toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Compile separate native packages and execute hash/fuel gates
        run: bash scripts/aot-smoke.sh
