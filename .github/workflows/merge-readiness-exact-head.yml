name: Exact-head merge-readiness Node 22 regression

on:
  pull_request:
    paths:
      - .github/workflows/merge-readiness-exact-head.yml
      - scripts/merge_readiness_probe_20261106.mjs
      - scripts/strict_github_evidence_20261106.mjs
      - tests/merge_readiness_*.test.mjs

permissions:
  contents: read

jobs:
  merge-readiness-node22:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exactly the source PR head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          clean: true
      - name: Verify repository identity and exact checked-out head
        shell: bash
        env:
          EXPECTED_REPOSITORY: ores-truffle-oreslang/oreslang-source.wasm
          EXPECTED_REPOSITORY_ID: '1419858954'
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = "pull_request" || {
            echo "::error::Manual dispatch is only a runner probe, not an exact-head PR receipt"
            exit 1
          }
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          printf 'MERGE_READINESS_CHECKOUT_HEAD=%s\n' "$EXPECTED_HEAD"
          printf 'MERGE_READINESS_CHECKOUT_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
      - name: Install pinned Node 22 toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Execute 608 exact-head merge-readiness tests
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node --version
          [[ "$(node --version)" =~ ^v22\. ]]
          node --test --test-reporter=tap \
            tests/merge_readiness_probe_20261106.test.mjs \
            tests/merge_readiness_dual_reviewer_mutations_20261107.test.mjs \
            tests/merge_readiness_job_name_collision_20261107.test.mjs \
            tests/merge_readiness_readback_setup_only_20261107.test.mjs \
            | tee "$RUNNER_TEMP/merge-readiness-node22.tap"
          grep -Fx '# tests 608' "$RUNNER_TEMP/merge-readiness-node22.tap"
          grep -Fx '# pass 608' "$RUNNER_TEMP/merge-readiness-node22.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/merge-readiness-node22.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/merge-readiness-node22.tap"
          grep -Fx '# cancelled 0' "$RUNNER_TEMP/merge-readiness-node22.tap"
          grep -Fx '# todo 0' "$RUNNER_TEMP/merge-readiness-node22.tap"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'MERGE_READINESS_TESTS_EXECUTED=608 head=%s tree=%s node=%s\n' \
            "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')" "$(node --version)"
          echo 'Source-model regression execution only; no compiled AttoLang guest or merge approval.' >> "$GITHUB_STEP_SUMMARY"
