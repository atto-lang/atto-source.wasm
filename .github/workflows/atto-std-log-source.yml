name: Atto native std/log namespace policy (source-only)
on:
  pull_request:
    paths:
      - 'stdlib/log.atto'
      - 'tests/log_policy_contract.test.mjs'
      - 'docs/ATTO_STD_LOG_NAMESPACE.md'
      - '.github/workflows/atto-std-log-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet
          git diff --cached --quiet
          echo "ATTO_LOG_POLICY_HEAD=$EXPECTED_HEAD"
          echo "ATTO_LOG_POLICY_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check native Atto source-extracted contract
        run: node --test tests/log_policy_contract.test.mjs
      - name: Record evidence boundary
        if: always()
        run: |
          echo 'SOURCE_ONLY: never claim native Atto guest, async sink, actor runtime, or AOT proof.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Zero-step Actions are NOT_EXECUTED; private source mirroring requires separate authorization.' >> "$GITHUB_STEP_SUMMARY"
