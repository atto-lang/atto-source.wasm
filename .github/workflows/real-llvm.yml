name: Real pinned Oreslang LLVM to Wasm guest gate (source-local)

# Security: no cross-org private-source export and no extra checkout token.
# Manual invocation is usable only AFTER independent protected-main review
# and ephemeral same-organization private-runner provisioning. This file on
# an unmerged PR is not an executable workflow_dispatch entrypoint.
on:
  workflow_dispatch:
    inputs:
      wasm_source_sha:
        description: Exact independently approved 40-hex WASM commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-local-real-llvm-wasm
  cancel-in-progress: false

jobs:
  integration:
    # An organization-scoped disposable runner, NOT a general shared carrier.
    # Never allow untrusted PR code to run on this source-capable worker.
    runs-on: [self-hosted, linux, x64, oreslang-private-ephemeral]
    timeout-minutes: 35
    env:
      ORESLANG_LLVM_SOURCE_SHA: 9a467fe32fed59a50b109758b0ff456810508b6a
      APPROVED_WASM_SHA: ${{ vars.ORESLANG_WASM_REAL_ACTOR_APPROVED_HEAD }}
      APPROVED_WASM_TREE: ${{ vars.ORESLANG_WASM_REAL_ACTOR_APPROVED_TREE }}
      APPROVED_LLVM_SHA: ${{ vars.ORESLANG_LLVM_REAL_ACTOR_SOURCE_SHA }}
      APPROVED_COMPILER_SHA256: ${{ vars.ORESLANG_LLVM_REAL_ACTOR_COMPILER_SHA256 }}
      REQUESTED_WASM_SHA: ${{ inputs.wasm_source_sha }}
      REPOSITORY_ID: ${{ github.repository_id }}
      PROTECTED_REF: ${{ github.ref_protected }}
      ORESLANG_LLVM_COMPILER: /opt/oreslang-private-toolchain/bin/oreslang-llvmc
    steps:
      - name: Enforce independent approval, exact Git source and protected trust boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ores-truffle-oreslang/oreslang-source.wasm'
          test "$REPOSITORY_ID" = '1419858954'
          test "$PROTECTED_REF" = 'true'
          [[ "$REQUESTED_WASM_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_WASM_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_WASM_TREE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_LLVM_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_COMPILER_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$REQUESTED_WASM_SHA" = "$APPROVED_WASM_SHA"
          test "$APPROVED_LLVM_SHA" = "$ORESLANG_LLVM_SOURCE_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
      - name: Check out exact reviewed WASM source (same repository only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.wasm_source_sha }}
          persist-credentials: false
      - name: Verify immutable WASM commit, tree and clean initial checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_WASM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$APPROVED_WASM_TREE"
          test -z "$(git status --porcelain)"
      - name: Admit pre-provisioned root-owned compiler and byte pin
        shell: bash
        run: |
          set -euo pipefail
          compiler="$ORESLANG_LLVM_COMPILER"
          test -f "$compiler" && test -x "$compiler" && test ! -L "$compiler"
          test "$(stat -c '%u' "$compiler")" = 0
          test "$(sha256sum "$compiler" | cut -d ' ' -f 1)" = "$APPROVED_COMPILER_SHA256"
          node --version
          clang --version
          command -v wasm-ld
          printf 'ORESLANG_LLVM_COMPILER_SHA256=%s\n' "$APPROVED_COMPILER_SHA256" >> "$GITHUB_ENV"
      - name: Run full WASM suite (host pass is not actor guest certification)
        shell: bash
        run: |
          set -euo pipefail
          npm test
      - name: Execute pinned LLVM scalar guest suite
        shell: bash
        run: |
          set -euo pipefail
          npm run test:real-compiler
      - name: Execute required real-source pooled actor guest, exact inventory and no skips
        shell: bash
        run: |
          set -euo pipefail
          npm run test:real-pooled-actors
          echo 'REAL_POOLED_ACTOR_GUEST_EXECUTED=YES'
      - name: Recheck exact source and compiler after guest execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_WASM_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$APPROVED_WASM_TREE"
          test -z "$(git status --porcelain)"
          test "$(sha256sum "$ORESLANG_LLVM_COMPILER" | cut -d ' ' -f 1)" = "$APPROVED_COMPILER_SHA256"
          printf 'SOURCE_LOCAL_WASM_SHA=%s\nSOURCE_LOCAL_WASM_TREE=%s\nLLVM_COMPILER_SOURCE_SHA=%s\nLLVM_COMPILER_SHA256=%s\n' \
            "$APPROVED_WASM_SHA" "$APPROVED_WASM_TREE" "$ORESLANG_LLVM_SOURCE_SHA" "$APPROVED_COMPILER_SHA256"
