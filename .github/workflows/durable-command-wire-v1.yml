name: Wasm durable command wire host boundary (NOT guest)
on:
  pull_request:
    paths:
      - 'src/durable-command-wire-v1.mjs'
      - 'tests/durable-command-wire-v1.test.mjs'
      - 'docs/EVENT_SOURCING_COMMAND_WIRE_V1.md'
      - '.github/workflows/durable-command-wire-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm-host-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Exact immutable source admission
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
          git ls-files -s src/durable-command-wire-v1.mjs tests/durable-command-wire-v1.test.mjs
      - name: Execute Node host-only durable command wire regressions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test tests/durable-command-wire-v1.test.mjs
