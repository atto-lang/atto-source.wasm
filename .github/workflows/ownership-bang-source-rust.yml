# SOURCE_ONLY Rust contract checks, not actual LLVM/Wasm guest execution.
name: Rust ownership-bang source contract
on:
  pull_request:
    paths:
      - 'tests/ownership_bang_fixture_contract.rs'
      - 'tests/fixtures/ownership-bang-v1/*.atto'
      - 'tests/ownership-bang-wasm32-guest.test.mjs'
      - 'tests/strict-atto-fixture.mjs'
      - '.github/workflows/ownership-bang-source-rust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-fixture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact source commit and clean checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          # Status alone misses assume-unchanged / skip-worktree index flags.
          for dir in tests tests/fixtures tests/fixtures/ownership-bang-v1; do
            test -d "$dir" && test ! -L "$dir"
          done
          for file in tests/ownership_bang_fixture_contract.rs \
            tests/ownership-bang-wasm32-guest.test.mjs \
            tests/strict-atto-fixture.mjs \
            tests/fixtures/ownership-bang-v1/*.atto; do
            test -f "$file" && test ! -L "$file"
            test "$(git cat-file -t "HEAD:$file")" = blob
            if [[ "$(git hash-object --no-filters -- "$file")" != "$(git rev-parse "HEAD:$file")" ]]; then
              echo "Uncommitted fixture/test bytes: $file" >&2
              exit 1
            fi
          done
      - name: Compile and execute Rust fixture-contract tests (SOURCE_ONLY)
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          git --version
          rustc --edition=2021 --deny warnings --test tests/ownership_bang_fixture_contract.rs \
            -o "$RUNNER_TEMP/ownership-bang-fixture-tests"
          "$RUNNER_TEMP/ownership-bang-fixture-tests" --nocapture
