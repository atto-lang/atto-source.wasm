name: HPC finance Wasm host risk-contract verification
on:
  pull_request:
    paths:
      - 'tests/hpc-finance-risk-parity.test.mjs'
      - 'contracts/v1/hpc-finance/**'
      - 'contracts/v1/numeric-parity/backend.json'
      - '.github/workflows/hpc-finance-risk-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-risk-host-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and canonical risk fixture
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git hash-object contracts/v1/hpc-finance/risk-gate-v1.tsv)" = cec489c1f7603617797340dd1b4a71cc85acfebd
          printf 'WASM_HPC_HOST_SOURCE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute bounded Node host-only risk oracle and mutation checks
        run: node --test tests/hpc-finance-risk-parity.test.mjs
      - name: Recognize compiler-admission test as SKIPPED unless reviewed LLVM compiler is supplied
        run: node --test tests/hpc-finance-source-negative.test.mjs
      - name: Record excluded compiler and guest evidence
        run: echo 'WASM_HPC_EVIDENCE=HOST_ONLY_NOT_COMPILED_WASM_GUEST'
