name: OTel guest parity admission (SOURCE-ONLY; NOT COMPILER PROOF)
on:
  pull_request:
    paths:
      - 'verification/otel/**'
      - '.github/workflows/otel-guest-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-otel-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact PR SHA checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert actual source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Exact supported Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify backend contract and 14 mutation-negative controls
        run: node verification/otel/verify-backend-admission.mjs --self-test
      - name: Assert source-only verification CANNOT be promoted to real guest
        run: |
          if node verification/otel/verify-backend-admission.mjs --require-executed-guest > "$RUNNER_TEMP/otel-gate.out" 2> "$RUNNER_TEMP/otel-gate.err"; then
            echo "ERROR: source-only gate falsely certified an OTel guest" >&2
            exit 1
          fi
          grep -F "this host-only check cannot certify guest execution" "$RUNNER_TEMP/otel-gate.err"
