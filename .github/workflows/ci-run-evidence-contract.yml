name: Exact GitHub run evidence contract

on:
  pull_request:
    paths:
      - scripts/verify_ci_run.py
      - scripts/test_verify_ci_run.py
      - docs/EXACT_GITHUB_RUN_EVIDENCE_V1.md
      - .github/workflows/ci-run-evidence-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-run-evidence-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Run all five-backend source-free security regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify_ci_run.py scripts/test_verify_ci_run.py
          python3 - <<'PY'
          import importlib.util
          import unittest
          from pathlib import Path

          path = Path("scripts/test_verify_ci_run.py")
          spec = importlib.util.spec_from_file_location("ci_evidence_tests", path)
          if spec is None or spec.loader is None:
              raise SystemExit("CI proof tests missing")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for round_id in range(1, 4):
              suite = unittest.defaultTestLoader.loadTestsFromModule(module)
              discovered = suite.countTestCases()
              if discovered < 28:
                  raise SystemExit(f"CI verifier tests shrank: {discovered}")
              result = unittest.TextTestRunner(verbosity=1).run(suite)
              if (result.testsRun != discovered or not result.wasSuccessful()
                      or result.skipped or result.expectedFailures or result.unexpectedSuccesses):
                  raise SystemExit("CI verifier test suite was skipped, incomplete or failed")
              print(f"VERIFIED_CI_EVIDENCE_TESTS_ROUND_{round_id}={discovered}")
          PY
