name: Exact GitHub run evidence contract

on:
  pull_request:
    paths:
      - scripts/verify_ci_run.rs
      - docs/EXACT_GITHUB_RUN_EVIDENCE_V1.md
      - .github/workflows/ci-run-evidence-contract.yml

permissions:
  contents: read

jobs:
  exact-run-evidence-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Bind evidence to actual checked-out Git tree
        id: source_head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || {
            echo "::error::CI verifier checkout differs from approved PR head"
            exit 1
          }
          git diff --quiet
          git diff --cached --quiet
          printf 'commit=%s\n' "$actual" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Compile Rust exact-run evidence verifier
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 -D warnings scripts/verify_ci_run.rs -o /tmp/verify-ci-run

      - name: Run all eight-repository source-free security regressions
        id: regressions
        shell: bash
        run: |
          set -euo pipefail
          for round_id in 1 2 3; do
            output="$(/tmp/verify-ci-run --self-test)"
            printf '%s\n' "$output"
            count="$(sed -n 's/^CI_EVIDENCE_REGRESSIONS=//p' <<<"$output")"
            test -n "$count"
            test "$count" -ge 95
            printf 'VERIFIED_CI_EVIDENCE_TESTS_ROUND_%s=%s\n' "$round_id" "$count"
          done

      - name: Write minimal run evidence (not compiled guest parity)
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          OBSERVED_HEAD: ${{ steps.source_head.outputs.commit }}
          OBSERVED_TREE: ${{ steps.source_head.outputs.tree }}
          SOURCE_OUTCOME: ${{ steps.source_head.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regressions.outcome }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RUN_TRIGGER_SHA: ${{ github.sha }}
          RUN_TRIGGER_EVENT: ${{ github.event_name }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          if [[ ! -x /tmp/verify-ci-run ]]; then
            rustc --edition=2021 -D warnings scripts/verify_ci_run.rs -o /tmp/verify-ci-run
          fi
          /tmp/verify-ci-run --write-source-free-report "$RUNNER_TEMP/source-free-ci-evidence.json"
          test -s "$RUNNER_TEMP/source-free-ci-evidence.json"

      - name: Upload minimal source-free CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-free-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-free-ci-evidence.json
          if-no-files-found: error
          retention-days: 3
