name: Atto perf hooks source contract (STATIC ONLY)
on:
  pull_request:
    paths:
      - 'stdlib/perf.atto'
      - 'core/perf_policy.atto'
      - 'tests/perf_policy_source.test.mjs'
      - 'tests/perf_policy_guest.test.mjs'
      - 'stdlib/perf_ids.atto'
      - 'stdlib/alloc/perf_trace_buffer.atto'
      - 'stdlib/alloc/perf_trace_slots.atto'
      - 'stdlib/perf_counter_slots.atto'
      - 'tests/perf_source_contract.test.mjs'
      - '.github/workflows/perf-hooks-source-contract.yml'
  push:
    paths:
      - 'stdlib/perf.atto'
      - 'core/perf_policy.atto'
      - 'tests/perf_policy_source.test.mjs'
      - 'tests/perf_policy_guest.test.mjs'
      - 'stdlib/perf_ids.atto'
      - 'stdlib/alloc/perf_trace_buffer.atto'
      - 'stdlib/alloc/perf_trace_slots.atto'
      - 'stdlib/perf_counter_slots.atto'
      - 'tests/perf_source_contract.test.mjs'
      - '.github/workflows/perf-hooks-source-contract.yml'
permissions:
  contents: read
jobs:
  static-perf-contract:
    name: static-perf-contract-NOT-guest-execution
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use supported Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run static source contract assertions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test tests/perf_source_contract.test.mjs tests/perf_policy_source.test.mjs
