# SOURCE-OWNED evidence. This never authorizes cross-organization source mirroring.
name: Atto backend-owned core cell owner policy (NON-GUEST)
on:
  pull_request:
    paths:
      - 'library/atto.core/cell.atto'
      - 'tests/**core*cell*'
      - '.github/workflows/atto-core-cell-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-cell-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable source PR head, without retained token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit, tree, blob, and clean checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CORE_CELL_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "CORE_CELL_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "CORE_CELL_SOURCE_BLOB=$(git rev-parse HEAD:library/atto.core/cell.atto)"
      - name: Set up immutable Node 22 test runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run backend source integrity and bounded owner-policy oracle
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/core-math-hash-cell-source.test.mjs
      - name: Report non-certifying source-only limit
        if: always()
        shell: bash
        run: |
          echo 'CORE_CELL_POLICY_SOURCE_TEST_ONLY; typed-MIR borrow and compiled Atto guest NOT_EXECUTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'No private Git tree was exported; zero-step workflows are NOT_EXECUTED.' >> "$GITHUB_STEP_SUMMARY"
