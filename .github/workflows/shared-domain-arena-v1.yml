name: Shared-domain arena v1 source-free parity
on:
  pull_request:
    paths:
      - 'contracts/v1/SHARED_DOMAIN_ARENAS_V1.md'
      - 'contracts/v1/shared_domain_arena_v1.json'
      - 'tools/contract_gate.rs'
      - 'tools/shared_domain_receipt.rs'
      - '.github/workflows/shared-domain-arena-v1.yml'
  push:
    paths:
      - 'contracts/v1/SHARED_DOMAIN_ARENAS_V1.md'
      - 'contracts/v1/shared_domain_arena_v1.json'
      - 'tools/contract_gate.rs'
      - 'tools/shared_domain_receipt.rs'
      - '.github/workflows/shared-domain-arena-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-shared-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head and immutable shared-domain blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          test -n "$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git hash-object contracts/v1/SHARED_DOMAIN_ARENAS_V1.md)" = "faed3d896ca66b1293b0e23b24b20b5038676a6c"
          test "$(git hash-object contracts/v1/shared_domain_arena_v1.json)" = "84594bc0e3e905b0950ac8728997138d66c44b50"
          test "$(git hash-object tools/contract_gate.rs)" = "64b79d867999a54f2321766c51e90936ceaab484"
          test "$(git hash-object tools/shared_domain_receipt.rs)" = "4c88b545f6c729cbfb66befdf9fd0c14f1add34c"
      - name: Compile Rust shared-domain verifier and receipt emitter
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings tools/contract_gate.rs -o /tmp/contract-gate
          rustc --edition=2021 -D warnings --test tools/shared_domain_receipt.rs -o /tmp/shared-domain-receipt-tests
          /tmp/shared-domain-receipt-tests
          rustc --edition=2021 -D warnings tools/shared_domain_receipt.rs -o /tmp/shared-domain-receipt
      - name: Execute 49 adversarial shared-domain checks in three rounds
        shell: bash
        run: |
          set -euo pipefail
          for round_id in 1 2 3; do
            output="$(/tmp/contract-gate shared-domain .)"
            printf '%s\n' "$output"
            grep -Fq 'cases=37' <<<"$output"
            grep -Fq 'tests=49' <<<"$output"
            printf 'SHARED_DOMAIN_SOURCEFREE_ROUND_%s_PASS=49\n' "$round_id"
          done
      - name: Emit bounded source-free shared-domain receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          /tmp/shared-domain-receipt "$RUNNER_TEMP/shared-domain-arena-v1.json"
          test -s "$RUNNER_TEMP/shared-domain-arena-v1.json"
      - name: Upload source-free shared-domain receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-domain-arena-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-domain-arena-v1.json
          if-no-files-found: error
          retention-days: 7
