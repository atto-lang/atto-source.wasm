name: Persistent actor data v1 policy conformance
on:
  pull_request:
    paths:
      - 'contracts/v1/persistent_actor_data_v1.json'
      - 'scripts/verify_persistent_actor_data_contract.py'
      - 'scripts/test_persistent_actor_data_contract.py'
      - '.github/workflows/persistent-actor-data-contract.yml'
      - 'src/actor-arena.mjs'
      - 'tests/actor-arena.test.mjs'
  push:
    paths:
      - 'contracts/v1/persistent_actor_data_v1.json'
      - 'scripts/verify_persistent_actor_data_contract.py'
      - 'scripts/test_persistent_actor_data_contract.py'
      - '.github/workflows/persistent-actor-data-contract.yml'
      - 'src/actor-arena.mjs'
      - 'tests/actor-arena.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert source HEAD and tree checked out
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -n "$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "EXACT_TESTED_SOURCE_COMMIT=$EXPECTED_SOURCE_HEAD"
          echo "EXACT_TESTED_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Pin identical five-backend contract source blobs
        shell: bash
        run: |
          test "$(git hash-object contracts/v1/persistent_actor_data_v1.json)" = "83a40f637ab77437108d02fedc8cde997f753928"
          test "$(git hash-object scripts/verify_persistent_actor_data_contract.py)" = "a6786404106d349d63e126878eb85c0dc85a3ee0"
          test "$(git hash-object scripts/test_persistent_actor_data_contract.py)" = "91fcff5c4ade0f9dd0c83def4b8966648b585d67"
      - name: Reject capability and fixture drift
        run: python3 scripts/verify_persistent_actor_data_contract.py
      - name: Execute negative policy mutation suite
        run: python3 scripts/test_persistent_actor_data_contract.py -v

  host-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute real WebAssembly.Memory actor arena tests
        run: node --test tests/actor-arena.test.mjs
