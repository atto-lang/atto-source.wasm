name: Persistent actor data v1 policy conformance
on:
  pull_request:
    paths:
      - 'contracts/v1/persistent_actor_data_v1.json'
      - 'scripts/verify_persistent_actor_data_contract.py'
      - 'scripts/test_persistent_actor_data_contract.py'
      - '.github/workflows/persistent-actor-data-contract.yml'
      - 'src/actor-arena.mjs'
      - 'tests/actor-arena.test.mjs'
  push:
    paths:
      - 'contracts/v1/persistent_actor_data_v1.json'
      - 'scripts/verify_persistent_actor_data_contract.py'
      - 'scripts/test_persistent_actor_data_contract.py'
      - '.github/workflows/persistent-actor-data-contract.yml'
      - 'src/actor-arena.mjs'
      - 'tests/actor-arena.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out exact source HEAD and tree
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "EXACT_TESTED_SOURCE_COMMIT=$EXPECTED_SOURCE_HEAD"
          echo "EXACT_TESTED_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Pin identical five-backend contract source blobs
        shell: bash
        run: |
          test "$(git hash-object contracts/v1/persistent_actor_data_v1.json)" = "83a40f637ab77437108d02fedc8cde997f753928"
          test "$(git hash-object scripts/verify_persistent_actor_data_contract.py)" = "846a177fdd1d5c1833305a4072cae2b22a14ff17"
          test "$(git hash-object scripts/test_persistent_actor_data_contract.py)" = "e6cde00668ee888ac8796ad9c373eae38a095f61"
      - name: Compile policy and tests in Python isolated mode
        run: python3 -I -m py_compile scripts/verify_persistent_actor_data_contract.py scripts/test_persistent_actor_data_contract.py
      - name: Reject capability and fixture drift
        run: python3 -I scripts/verify_persistent_actor_data_contract.py
      - name: Execute negative policy mutation suite
        run: python3 -I scripts/test_persistent_actor_data_contract.py -v

      # This artifact is metadata only; never upload source, binaries or test logs.
      - name: Record source-local checkout identity (diagnostic only)
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          sha = re.compile(r"^[a-f0-9]{40}$")
          workspace = os.environ.get("GITHUB_WORKSPACE", "")
          def rev(expression):
              try:
                  completed = subprocess.run(
                      ["git", "-C", workspace, "rev-parse", "--verify", expression],
                      text=True, capture_output=True, timeout=5, check=False)
              except (OSError, subprocess.TimeoutExpired):
                  return None
              value = completed.stdout.strip()
              return value if completed.returncode == 0 and sha.fullmatch(value) else None

          evidence = {
              "schema": "oreslang-integration-ci-diagnostic-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "job": os.environ["GITHUB_JOB"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "workflow_run_sha": os.environ["GITHUB_SHA"],
              "expected_tested_source_commit": os.environ["EXPECTED_SOURCE_HEAD"],
              "checkout_matches_expected_source": rev("HEAD") == os.environ["EXPECTED_SOURCE_HEAD"],
              "checkout_commit": rev("HEAD"),
              "checkout_tree": rev("HEAD^{tree}"),
              "runner_name": os.environ.get("RUNNER_NAME", ""),
              "verified_execution_claim": False,
              "native_runtime_parity_certified": False,
              "requires_independent_job_step_and_test_report_verification": True,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "actor-memory-ci-diagnostic.json"
          output.write_text(json.dumps(evidence, sort_keys=True, indent=2) + "\n",
                            encoding="utf-8")
          PY
      - name: Upload source-local diagnostic metadata (not runtime certification)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actor-memory-ci-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actor-memory-ci-diagnostic.json
          if-no-files-found: error
          retention-days: 3

  host-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out exact source HEAD and tree
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "EXACT_TESTED_SOURCE_COMMIT=$EXPECTED_SOURCE_HEAD"
          echo "EXACT_TESTED_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute real WebAssembly.Memory actor arena tests
        run: node --test tests/actor-arena.test.mjs

      # This artifact is metadata only; never upload source, binaries or test logs.
      - name: Record source-local checkout identity (diagnostic only)
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          sha = re.compile(r"^[a-f0-9]{40}$")
          workspace = os.environ.get("GITHUB_WORKSPACE", "")
          def rev(expression):
              try:
                  completed = subprocess.run(
                      ["git", "-C", workspace, "rev-parse", "--verify", expression],
                      text=True, capture_output=True, timeout=5, check=False)
              except (OSError, subprocess.TimeoutExpired):
                  return None
              value = completed.stdout.strip()
              return value if completed.returncode == 0 and sha.fullmatch(value) else None

          evidence = {
              "schema": "oreslang-integration-ci-diagnostic-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "job": os.environ["GITHUB_JOB"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "workflow_run_sha": os.environ["GITHUB_SHA"],
              "expected_tested_source_commit": os.environ["EXPECTED_SOURCE_HEAD"],
              "checkout_matches_expected_source": rev("HEAD") == os.environ["EXPECTED_SOURCE_HEAD"],
              "checkout_commit": rev("HEAD"),
              "checkout_tree": rev("HEAD^{tree}"),
              "runner_name": os.environ.get("RUNNER_NAME", ""),
              "verified_execution_claim": False,
              "native_runtime_parity_certified": False,
              "requires_independent_job_step_and_test_report_verification": True,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "actor-memory-ci-diagnostic.json"
          output.write_text(json.dumps(evidence, sort_keys=True, indent=2) + "\n",
                            encoding="utf-8")
          PY
      - name: Upload source-local diagnostic metadata (not runtime certification)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actor-memory-ci-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actor-memory-ci-diagnostic.json
          if-no-files-found: error
          retention-days: 3
