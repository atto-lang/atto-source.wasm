name: Reactive signal contract
on:
  pull_request:
    paths:
      - 'contracts/v1/reactive-signal-v1.json'
      - 'tools/contract_gate.rs'
      - '.github/workflows/reactive-signal-contract.yml'
  push:
    branches: ['contract/reactive-signal-v1-20261017']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and test Rust reactive gate
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings --test tools/contract_gate.rs -o /tmp/contract-gate-tests
          /tmp/contract-gate-tests
          rustc --edition=2021 -D warnings tools/contract_gate.rs -o /tmp/contract-gate
      - name: Verify reactive contract
        run: /tmp/contract-gate reactive .
