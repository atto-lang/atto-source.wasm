name: Focused actor arena isolation
on:
  pull_request:
    paths:
      - 'src/actor-arena.mjs'
      - 'tests/actor-arena*.test.mjs'
      - '.github/workflows/actor-arena-isolation-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact head and host tests (not guest or AOT parity)
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse 'HEAD^{tree}'
          node --version
          node --test tests/actor-arena*.test.mjs
