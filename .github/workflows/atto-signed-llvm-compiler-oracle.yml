name: AttoLang signed LLVM compiler provenance (source-only oracle)
on:
  pull_request:
    paths:
      - 'scripts/attested-llvm-compiler.mjs'
      - 'tests/attested-llvm-compiler.test.mjs'
      - 'tests/sealed_aot_reserved_operators_real_guest_20261107.test.mjs'
      - '.github/workflows/atto-signed-llvm-compiler-oracle.yml'
permissions:
  contents: read
jobs:
  provenance-oracle-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - name: Pin exact Git head and clean checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "ATTO_SIGNED_COMPILER_ORACLE_HEAD=$EXPECTED_HEAD"
          echo "ATTO_SIGNED_COMPILER_ORACLE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Execute exact-head schema/mutation and source operator oracle tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          # This job deliberately does not execute a native LLVM compiler.
          # It MUST report one skipped real native compiler/Wasm guest test.
          env -u ORESLANG_LLVM_COMPILER -u ATTO_SEALED_OPERATOR_REAL_GUEST_REQUIRED \
            node --test --test-reporter=tap \
              tests/attested-llvm-compiler.test.mjs \
              tests/sealed_aot_reserved_operators_real_guest_20261107.test.mjs \
            | tee "$RUNNER_TEMP/atto-signed-compiler-source-only.tap"
          grep -Fxq '# tests 78' "$RUNNER_TEMP/atto-signed-compiler-source-only.tap"
          grep -Fxq '# pass 77' "$RUNNER_TEMP/atto-signed-compiler-source-only.tap"
          grep -Fxq '# fail 0' "$RUNNER_TEMP/atto-signed-compiler-source-only.tap"
          grep -Fxq '# skipped 1' "$RUNNER_TEMP/atto-signed-compiler-source-only.tap" || \
            grep -Fxq '# skip 1' "$RUNNER_TEMP/atto-signed-compiler-source-only.tap"
          echo 'ATTO_SIGNED_COMPILER_SOURCE_ONLY=77_PASS_1_NATIVE_SKIPPED'
          echo 'ATTO_SIGNED_COMPILER_NATIVE=NOT_EXECUTED'
