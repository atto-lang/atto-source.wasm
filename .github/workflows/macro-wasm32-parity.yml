name: Macro scalar Wasm32 source-integrity lane
on:
  pull_request:
    paths:
      - 'tests/fixtures/macro-scalar-v1/**'
      - 'tests/macro-scalar-wasm32-parity.test.mjs'
      - 'scripts/compile-ores.mjs'
      - 'scripts/restricted-build-environment.mjs'
      - 'tests/restricted-build-environment.test.mjs'
      - 'scripts/macro-wasm32-guest-gate.mjs'
      - 'tests/macro-wasm32-guest-gate.test.mjs'
      - 'scripts/atomic-release.mjs'
      - 'src/isolated-runner.mjs'
      - 'package.json'
      - '.github/workflows/macro-wasm32-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'MACRO_WASM_SOURCE_ONLY_HEAD=%s\nTREE=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check source-only parity fixture hashes (NOT guest evidence)
        env:
          ORESLANG_MACRO_WASM_PARITY_REQUIRED: '0'
        run: |
          node --test tests/macro-scalar-wasm32-parity.test.mjs tests/restricted-build-environment.test.mjs tests/macro-wasm32-guest-gate.test.mjs
          echo 'MACRO_WASM_SOURCE_ONLY_PINS_PASS - guest execution NOT checked'
