name: Private abstract actor hook v1 contract
on:
  pull_request:
    paths:
      - 'contracts/v1/PRIVATE_ABSTRACT_ACTOR_HOOK_V1.md'
      - 'contracts/v1/private-abstract-actor-hook-v1.json'
      - 'contracts/v1/verify_private_abstract_actor_hook_v1.py'
      - 'contracts/v1/test_private_abstract_actor_hook_v1.py'
      - '.github/workflows/private-abstract-actor-hook-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-reference-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Attest exact checked-out commit and Git tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'Actor-hook contract checkout %s\n' "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: Run adversarial manifest verification tests
        run: python3 -m unittest discover -s contracts/v1 -p 'test_private_abstract_actor_hook_v1.py' -v
      - name: Verify each backend has a fail-closed declared contract
        run: |
          set -eu
          for backend in java llvm net wasm forge; do
            python3 contracts/v1/verify_private_abstract_actor_hook_v1.py --backend "$backend"
          done
      - name: Explicitly deny manifest-only compiler evidence
        run: |
          if python3 contracts/v1/verify_private_abstract_actor_hook_v1.py --backend java --require-compiler-evidence; then
            echo 'ERROR: a manifest was promoted into compiler evidence' >&2
            exit 1
          fi
          echo 'NORMATIVE_CONTRACT_ONLY: compiler and guest tests remain separate mandatory gates'
