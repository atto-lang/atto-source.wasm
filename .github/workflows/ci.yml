name: WebAssembly scalar backend checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-scalar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact actor PR-head checkout and Git tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
          git hash-object contracts/v1/verify_actor_pipeline_v1.py contracts/v1/test_actor_pipeline_v1.py
      - name: Verify exact-blob actor routing fixture
        run: |
          python3 contracts/v1/verify_actor_pipeline_v1.py contracts/v1/actor-pipeline-routing-v1.json
          python3 contracts/v1/test_actor_pipeline_v1.py
      - name: Test pinned Sendable Serializable static contract (Rust)
        run: cargo test --manifest-path tools/serde-contract-gate/Cargo.toml
      - name: Verify pinned Sendable Serializable DATA CONTROL contract (Rust)
        run: cargo run --manifest-path tools/serde-contract-gate/Cargo.toml -- --root .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Browser-portable actor arena admission (Node host-only; NOT Wasm guest)
        shell: bash
        run: |
          set -euo pipefail
          # This runs the actual actor-arena ESM and its adversarial tests,
          # including a Node-free data: ESM import and cross-realm byte brands.
          # It does NOT establish browser/Web Worker or compiled guest parity.
          test "$(git hash-object src/actor-arena.mjs)" = 0a7f7ec30410d396997c3651706fce142ec9cfb4
          test "$(git hash-object tests/actor-arena-option-slice-v1.test.mjs)" = 52c6982f16e5208ad9c86805c1ef4c3b4fd01b43
          node --check src/actor-arena.mjs
          node --check tests/actor-arena-option-slice-v1.test.mjs
          node --test --test-reporter=tap tests/actor-arena-option-slice-v1.test.mjs | tee "$RUNNER_TEMP/wasm-actor-arena.tap"
          # Fail closed on a smaller inventory, skipped tests, or a silently
          # omitted browser-compatibility/brand-security regression.
          for expected in '# tests 9' '# pass 9' '# fail 0' '# cancelled 0' '# skipped 0' '# todo 0'; do
            grep -Fx -- "$expected" "$RUNNER_TEMP/wasm-actor-arena.tap"
          done
          echo "WASM_ACTOR_ARENA_HOST_ONLY|head=$(git rev-parse HEAD)|tests_executed=9|guest=NOT_EXECUTED"

      - name: Verify Rust-only numeric backend capability claims (data-only)
        run: |
          cargo test --manifest-path tools/serde-contract-gate/Cargo.toml --bin numeric-admission
          cargo run --manifest-path tools/serde-contract-gate/Cargo.toml --bin numeric-admission -- .
      - name: Verify remaining legacy numeric reference vectors (data-only)
        # Python vector-oracle migration remains outstanding; retain coverage.
        run: python3 -m unittest discover -s tests -p 'test_numeric_*.py' -v
      - name: Install wasm32 toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Adversarial shared scalar runner self-tests
        run: python3 contracts/scalar/v1/selftest.py
      - name: Test guest admission and compiler bridge
        run: npm test
