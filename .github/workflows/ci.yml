name: WebAssembly scalar backend checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-scalar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact actor PR-head checkout and Git tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
          git hash-object tools/contract_gate.rs contracts/v1/actor-pipeline-routing-v1.json
      - name: Compile and test Rust contract gates
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings --test tools/contract_gate.rs -o /tmp/contract-gate-tests
          /tmp/contract-gate-tests
          rustc --edition=2021 -D warnings tools/contract_gate.rs -o /tmp/contract-gate
      - name: Verify exact-blob actor routing fixture
        run: /tmp/contract-gate actor-pipeline .
      - name: Verify pinned Sendable Serializable DATA CONTROL contract
        run: /tmp/contract-gate serde .
      - name: Verify structural tuple v2 integrity and adversarial mutations
        run: /tmp/contract-gate structural-v2 .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate numerical vectors and capability claims (data-only)
        run: /tmp/contract-gate numeric .
      - name: Install wasm32 toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Adversarial shared scalar runner self-tests
        run: python3 contracts/scalar/v1/selftest.py
      - name: Test guest admission and compiler bridge
        run: npm test
