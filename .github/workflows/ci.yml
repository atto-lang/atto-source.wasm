name: WebAssembly scalar backend checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-scalar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact actor PR-head checkout and Git tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
          git hash-object contracts/v1/verify_actor_pipeline_v1.py contracts/v1/test_actor_pipeline_v1.py
      - name: Verify exact-blob actor routing fixture
        run: |
          python3 contracts/v1/verify_actor_pipeline_v1.py contracts/v1/actor-pipeline-routing-v1.json
          python3 contracts/v1/test_actor_pipeline_v1.py
      - name: Self-test fail-closed Option-pattern evidence harness (synthetic only)
        run: python3 -m unittest discover -s scripts -p test_option_pattern_contract.py -v
      - name: Verify shared Option-pattern inventory (LLVM compiler pending)
        run: python3 scripts/check_option_pattern_contract.py --backend wasm
      - name: Test pinned Sendable Serializable static contract (Rust)
        run: cargo test --manifest-path tools/serde-contract-gate/Cargo.toml
      - name: Verify pinned Sendable Serializable DATA CONTROL contract (Rust)
        run: cargo run --manifest-path tools/serde-contract-gate/Cargo.toml -- --root .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify Rust-only numeric backend capability claims (data-only)
        run: |
          cargo test --manifest-path tools/serde-contract-gate/Cargo.toml --bin numeric-admission
          cargo run --manifest-path tools/serde-contract-gate/Cargo.toml --bin numeric-admission -- .
      - name: Verify remaining legacy numeric reference vectors (data-only)
        # Python vector-oracle migration remains outstanding; retain coverage.
        run: python3 -m unittest discover -s tests -p 'test_numeric_*.py' -v
      - name: Install wasm32 toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Adversarial shared scalar runner self-tests
        run: python3 contracts/scalar/v1/selftest.py
      - name: Test guest admission and compiler bridge
        run: npm test
