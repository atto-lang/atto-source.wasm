name: WebAssembly scalar backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebAssembly toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Run real WebAssembly admission and bridge tests
        run: npm test
