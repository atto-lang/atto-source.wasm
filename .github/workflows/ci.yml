name: WebAssembly scalar backend checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-scalar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact actor PR-head checkout and Git tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
          git hash-object contracts/v1/verify_actor_pipeline_v1.py contracts/v1/test_actor_pipeline_v1.py
      - name: Verify exact-blob actor routing fixture
        run: |
          python3 contracts/v1/verify_actor_pipeline_v1.py contracts/v1/actor-pipeline-routing-v1.json
          python3 contracts/v1/test_actor_pipeline_v1.py
      - name: Verify pinned Sendable Serializable DATA CONTROL contract
        run: python3 scripts/verify_serde_contract.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate numerical vectors and capability claims (data-only)
        run: python3 -m unittest discover -s tests -p 'test_numeric_*.py' -v
      - name: Install wasm32 toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Test guest admission and compiler bridge
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/actor-routing-evidence"
          mkdir -p "$evidence"
          npm test 2>&1 | tee "$evidence/wasm-tests.log"
      - name: Bind executable WASM test evidence to exact tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/actor-routing-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -s "$evidence/wasm-tests.log"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            for file in contracts/v1/verify_actor_pipeline_v1.py \
                contracts/v1/test_actor_pipeline_v1.py \
                contracts/v1/actor-pipeline-routing-v1.json; do
              printf 'blob:%s=%s\n' "$file" "$(git hash-object "$file")"
            done
            printf 'sha256:wasm-tests.log=%s\n' "$(sha256sum "$evidence/wasm-tests.log" | cut -d ' ' -f1)"
          } > "$evidence/identity.txt"
      - name: Upload exact-source WASM routing test evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-routing-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actor-routing-evidence/
          retention-days: 3
          if-no-files-found: error
