name: Enum case overload static ABI v2
on:
  push:
    branches: [main]
    paths:
      - 'contracts/v2/**'
      - 'tools/contract_gate.rs'
      - '.github/workflows/enum-case-contract-v2.yml'
  pull_request:
    paths:
      - 'contracts/v2/**'
      - 'tools/contract_gate.rs'
      - '.github/workflows/enum-case-contract-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Compile Rust enum ABI oracle
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings --test tools/contract_gate.rs -o /tmp/contract-gate-tests
          /tmp/contract-gate-tests enum_overlap_exhaustive
          /tmp/contract-gate-tests enum_nominal_boundaries
          rustc --edition=2021 -D warnings tools/contract_gate.rs -o /tmp/contract-gate
      - name: Verify source-free overlap model and EOS2 golden bytes
        run: /tmp/contract-gate enum-v2 .
