name: Integration declaration integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-declarations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  declaration-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and test Rust integration gate
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings --test tools/contract_gate.rs -o /tmp/contract-gate-tests
          /tmp/contract-gate-tests
          rustc --edition=2021 -D warnings tools/contract_gate.rs -o /tmp/contract-gate
      - name: Verify declaration-only manifest (not a runtime parity claim)
        run: /tmp/contract-gate integration .
