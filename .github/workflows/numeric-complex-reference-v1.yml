name: Complex128 reference conformance (finite + IEEE special; not guest parity)
on:
  pull_request:
    paths:
      - contracts/v1/numeric-complex/**
      - .github/workflows/numeric-complex-reference-v1.yml

permissions:
  contents: read

jobs:
  complex128-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact checked-out commit and clean tree
        id: identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$EXPECTED_HEAD"
          git diff --quiet
          git diff --cached --quiet
          printf 'commit=%s\n' "$observed" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          printf 'finite_fixture_blob=%s\n' "$(git hash-object contracts/v1/numeric-complex/complex128-finite-reference-v1.json)" >> "$GITHUB_OUTPUT"
          printf 'finite_verifier_blob=%s\n' "$(git hash-object contracts/v1/numeric-complex/test_complex128_finite_reference.py)" >> "$GITHUB_OUTPUT"
          printf 'special_fixture_blob=%s\n' "$(git hash-object contracts/v1/numeric-complex/complex128-ieee-special-v1.json)" >> "$GITHUB_OUTPUT"
          printf 'special_verifier_blob=%s\n' "$(git hash-object contracts/v1/numeric-complex/test_complex128_ieee_special.py)" >> "$GITHUB_OUTPUT"
      - name: Execute finite and IEEE-special reference suites in three complete rounds
        id: reference_oracles
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -m py_compile \
            contracts/v1/numeric-complex/test_complex128_finite_reference.py \
            contracts/v1/numeric-complex/test_complex128_ieee_special.py
          python3 -I - <<'PY'
          import importlib.util
          from pathlib import Path
          import unittest

          suites = (
              ("finite", Path("contracts/v1/numeric-complex/test_complex128_finite_reference.py"), 10),
              ("ieee_special", Path("contracts/v1/numeric-complex/test_complex128_ieee_special.py"), 8),
          )
          for round_id in range(1, 4):
              for label, path, expected in suites:
                  spec = importlib.util.spec_from_file_location("complex128_" + label, path)
                  if spec is None or spec.loader is None:
                      raise SystemExit("NUMERIC_COMPLEX_TEST_SOURCE_MISSING_" + label)
                  module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(module)
                  suite = unittest.defaultTestLoader.loadTestsFromModule(module)
                  if suite.countTestCases() != expected:
                      raise SystemExit("NUMERIC_COMPLEX_V1_TEST_COUNT_CHANGED_" + label)
                  result = unittest.TextTestRunner(verbosity=2).run(suite)
                  if (result.testsRun != expected or not result.wasSuccessful()
                          or result.skipped or result.expectedFailures
                          or result.unexpectedSuccesses):
                      raise SystemExit("NUMERIC_COMPLEX_REFERENCE_ROUND_FAILED_" + label)
                  print(f"NUMERIC_COMPLEX_{label.upper()}_ROUND_{round_id}={expected}_NOT_GUEST")
          PY
      - name: Write non-certifying reference run metadata
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          OBSERVED_HEAD: ${{ steps.identity.outputs.commit }}
          OBSERVED_TREE: ${{ steps.identity.outputs.tree }}
          FINITE_FIXTURE_BLOB: ${{ steps.identity.outputs.finite_fixture_blob }}
          FINITE_VERIFIER_BLOB: ${{ steps.identity.outputs.finite_verifier_blob }}
          SPECIAL_FIXTURE_BLOB: ${{ steps.identity.outputs.special_fixture_blob }}
          SPECIAL_VERIFIER_BLOB: ${{ steps.identity.outputs.special_verifier_blob }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          ORACLE_OUTCOME: ${{ steps.reference_oracles.outcome }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              "schema": "oreslang-complex128-reference-only-v2",
              "classification": "REFERENCE_ONLY_NOT_NATIVE_COMPILER_PARITY",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": os.environ["REPOSITORY_ID"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "expected_pr_head": os.environ["EXPECTED_HEAD"],
              "observed_checkout_commit": os.environ["OBSERVED_HEAD"],
              "observed_checkout_tree": os.environ["OBSERVED_TREE"],
              "reference_git_blobs": {
                  "complex128_finite_fixture": os.environ["FINITE_FIXTURE_BLOB"],
                  "complex128_finite_verifier": os.environ["FINITE_VERIFIER_BLOB"],
                  "complex128_ieee_special_fixture": os.environ["SPECIAL_FIXTURE_BLOB"],
                  "complex128_ieee_special_verifier": os.environ["SPECIAL_VERIFIER_BLOB"],
              },
              "checkout_step_outcome": os.environ["IDENTITY_OUTCOME"],
              "finite_and_ieee_reference_step_outcome": os.environ["ORACLE_OUTCOME"],
              "runner_name": os.environ.get("RUNNER_NAME", ""),
              "native_compiler_executed": False,
              "guest_execution_verified": False,
              "complex_parity_certified": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "complex128-reference-evidence.json"
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("COMPLEX128_REFERENCE_EVIDENCE_WRITTEN_NOT_NATIVE_GUEST")
          PY
      - name: Upload short-lived reference-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: complex128-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/complex128-reference-evidence.json
          if-no-files-found: error
          retention-days: 3
