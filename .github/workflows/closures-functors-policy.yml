name: Closure/functor source-free candidate policy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reject forged artifact and source pins
        run: node --test tests/closures-functors-policy.test.mjs
      # Never retrieve the private compiler with this source-free token.
      # Actual guest compilation requires an explicitly supplied private artifact.
