name: Wasm raw source terminal-control preflight (host only)
on:
  pull_request:
    paths:
      - '.github/workflows/source-terminal-control.yml'
      - 'scripts/compile-ores.mjs'
      - 'scripts/compile-source-actor.mjs'
      - 'scripts/source-terminal-control.mjs'
      - 'tests/source-terminal-control.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-control-host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout and actual source bytes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          for file in scripts/compile-ores.mjs scripts/compile-source-actor.mjs \
            scripts/source-terminal-control.mjs tests/source-terminal-control.test.mjs; do
            test -f "$file" && test ! -L "$file"
            test "$(git hash-object --no-filters -- "$file")" = "$(git rev-parse "HEAD:$file")"
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Execute preflight and no-compiler-invocation host tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/source-terminal-control.test.mjs
