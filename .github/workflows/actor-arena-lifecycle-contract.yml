name: Actor arena lifecycle v1 policy conformance
on:
  push:
    branches:
      - hardening/persistent-data-evidence-parity-20261016
    paths:
      - contracts/v1/actor_arena_lifecycle_v1.json
      - scripts/verify_actor_arena_lifecycle_contract.py
      - scripts/test_actor_arena_lifecycle_contract.py
      - .github/workflows/actor-arena-lifecycle-contract.yml
  pull_request:
    paths:
      - contracts/v1/actor_arena_lifecycle_v1.json
      - scripts/verify_actor_arena_lifecycle_contract.py
      - scripts/test_actor_arena_lifecycle_contract.py
      - .github/workflows/actor-arena-lifecycle-contract.yml
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin exact shared lifecycle blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object contracts/v1/actor_arena_lifecycle_v1.json)" = "b921f18d8be719957f2301ffd1881c23ecb85ea8"
          test "$(git ls-tree HEAD -- contracts/v1/actor_arena_lifecycle_v1.json | awk '{print $1 ":" $2 ":" $3}')" = "100644:blob:b921f18d8be719957f2301ffd1881c23ecb85ea8"
          test -f contracts/v1/actor_arena_lifecycle_v1.json && test ! -L contracts/v1/actor_arena_lifecycle_v1.json
          test "$(git hash-object scripts/verify_actor_arena_lifecycle_contract.py)" = "26bca4b2e8511b4db204338b94fa400173bcea1a"
          test "$(git ls-tree HEAD -- scripts/verify_actor_arena_lifecycle_contract.py | awk '{print $1 ":" $2 ":" $3}')" = "100644:blob:26bca4b2e8511b4db204338b94fa400173bcea1a"
          test -f scripts/verify_actor_arena_lifecycle_contract.py && test ! -L scripts/verify_actor_arena_lifecycle_contract.py
          test "$(git hash-object scripts/test_actor_arena_lifecycle_contract.py)" = "ee71af725c59707002520bffeda2dce4457e46d6"
          test "$(git ls-tree HEAD -- scripts/test_actor_arena_lifecycle_contract.py | awk '{print $1 ":" $2 ":" $3}')" = "100644:blob:ee71af725c59707002520bffeda2dce4457e46d6"
          test -f scripts/test_actor_arena_lifecycle_contract.py && test ! -L scripts/test_actor_arena_lifecycle_contract.py
      - name: Execute lifecycle contract and 29 adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -m py_compile scripts/verify_actor_arena_lifecycle_contract.py scripts/test_actor_arena_lifecycle_contract.py
          python3 -I - <<'PY'
          import importlib.util
          import sys
          import unittest
          from pathlib import Path

          vpath = Path("scripts/verify_actor_arena_lifecycle_contract.py")
          vspec = importlib.util.spec_from_file_location("verify_actor_arena_lifecycle_contract", vpath)
          if vspec is None or vspec.loader is None:
              raise SystemExit("missing lifecycle verifier")
          verifier = importlib.util.module_from_spec(vspec)
          sys.modules[vspec.name] = verifier
          vspec.loader.exec_module(verifier)

          verifier.validate_raw(Path("contracts/v1/actor_arena_lifecycle_v1.json").read_bytes())

          tpath = Path("scripts/test_actor_arena_lifecycle_contract.py")
          tspec = importlib.util.spec_from_file_location("actor_arena_lifecycle_tests", tpath)
          if tspec is None or tspec.loader is None:
              raise SystemExit("missing lifecycle tests")
          tests = importlib.util.module_from_spec(tspec)
          tspec.loader.exec_module(tests)

          suite = unittest.defaultTestLoader.loadTestsFromTestCase(tests.ActorArenaLifecyclePolicyTest)
          if suite.countTestCases() != 29:
              raise SystemExit("lifecycle test count differs from exactly 29")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 29 or not result.wasSuccessful() or result.skipped
                  or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit("lifecycle policy tests failed or incomplete")
          PY
      - name: Emit non-certifying exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lifecycle-evidence
          python3 -I - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          report = {
            "schema": "oreslang.actor_arena_lifecycle_source_head_v1",
            "classification": "POLICY_ONLY_NOT_NATIVE_OR_GUEST_CERTIFICATION",
            "repository": os.environ["GITHUB_REPOSITORY"],
            "head_sha": git("rev-parse", "HEAD"),
            "head_tree": git("rev-parse", "HEAD^{tree}"),
            "run_id": int(os.environ["GITHUB_RUN_ID"]),
            "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
            "source_free_blobs": {
              "contracts/v1/actor_arena_lifecycle_v1.json": "b921f18d8be719957f2301ffd1881c23ecb85ea8",
              "scripts/verify_actor_arena_lifecycle_contract.py": "26bca4b2e8511b4db204338b94fa400173bcea1a",
              "scripts/test_actor_arena_lifecycle_contract.py": "ee71af725c59707002520bffeda2dce4457e46d6"
            },
            "policy_tests_executed": 29,
            "native_runtime_certified": False,
            "guest_runtime_certified": False,
            "physical_reclamation_certified": False
          }
          Path("lifecycle-evidence/actor-arena-lifecycle-source-head.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload lifecycle policy evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actor-arena-lifecycle-source-head
          path: lifecycle-evidence/actor-arena-lifecycle-source-head.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
