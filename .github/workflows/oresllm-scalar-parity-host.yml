# Host-only fixture/BigInt oracle. Does NOT certify compiler or backend parity.
name: OresLLM shared checked-i64 host contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-i64-host-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact clean checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Execute shared host reference and mutation suite (NOT Oreslang execution)
        run: node --test tests/oresllm-scalar-contract.test.mjs tests/oresllm-backend-binding.test.mjs tests/oresllm-evidence-admission.test.mjs
