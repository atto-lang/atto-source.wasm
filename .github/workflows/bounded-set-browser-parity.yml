name: Bounded Set browser compiler guest parity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-set-guests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate source snapshot
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD 'HEAD^{tree}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build and authenticate pinned public Rust browser compiler
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          compiler_root="$RUNNER_TEMP/atto-set-compiler"
          git init "$compiler_root"
          cd "$compiler_root"
          git -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.rs.git 37908fbe096c7780ce211b7996e03e9d09396d7d
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 37908fbe096c7780ce211b7996e03e9d09396d7d
          test "$(git rev-parse HEAD^{tree})" = 62abf6108aab4a48fb46a037db11ad50a652897d
          git fsck --full
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.1 build --locked --release --target wasm32-unknown-unknown --lib
          compiler="$compiler_root/target/wasm32-unknown-unknown/release/atto_compiler.wasm"
          test -s "$compiler"
          git diff --exit-code HEAD --
          printf 'ATTO_BROWSER_SOURCE_ROOT=%s\nATTO_BROWSER_COMPILER=%s\nATTO_BROWSER_COMPILER_SHA256=%s\n' "$compiler_root" "$compiler" "$(sha256sum "$compiler" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Require real browser adapter Wasm and ESM guests
        env:
          ATTO_SET_BROWSER_REQUIRED: '1'
        run: node --test tests/bounded-set-browser-compiler.test.mjs
