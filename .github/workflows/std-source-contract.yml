name: Atto native std protocol source contract (not guest execution)
on:
  pull_request:
    paths:
      - 'stdlib/std/websocket.atto'
      - 'stdlib/std/quic.atto'
      - 'stdlib/std/compute.atto'
      - 'tests/stdlib/**'
      - '.github/workflows/std-source-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head and Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "ATTO_STD_SOURCE_HEAD=$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: Verify source exports, imports, and mutation negatives (NOT guest execution)
        run: node --test tests/stdlib/source_contract.test.mjs
