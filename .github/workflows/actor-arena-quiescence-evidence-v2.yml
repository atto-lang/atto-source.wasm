name: Actor arena quiescence evidence v2 (source-free)
on:
  pull_request:
    paths:
      - 'contracts/v1/actor_arena_quiescence_matrix_v2.json'
      - 'contracts/v1/ACTOR_ARENA_QUIESCENCE_EVIDENCE_V2.md'
      - 'tools/contract_gate.rs'
      - '.github/workflows/actor-arena-quiescence-evidence-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-free-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile Rust quiescence policy gate
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings tools/contract_gate.rs -o /tmp/contract-gate
      - name: Check quiescence policy and reject weakened claims
        shell: bash
        run: |
          set -euo pipefail
          output="$(/tmp/contract-gate actor-arena-quiescence .)"
          printf '%s\n' "$output"
          grep -Fq 'barriers=16' <<<"$output"
          grep -Fq 'negative_controls=27' <<<"$output"
          grep -Fq 'runtime=NOT_VERIFIED' <<<"$output"
