name: Atto core borrow range parity v1 (source-only; no borrow proof)
on:
  pull_request:
    paths:
      - 'stdlib/core/borrow_ranges.atto'
      - 'contracts/atto-core-borrow-ranges-v1.json'
      - 'tests/core-borrow-ranges-source.test.mjs'
      - '.github/workflows/atto-core-borrow-ranges-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-policy-cannot-mint-compiler-loans:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin Git head and source/contract blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ATTO_CORE_BORROW_HEAD=$EXPECTED_HEAD"
          echo "ATTO_CORE_BORROW_TREE=$(git rev-parse 'HEAD^{tree}')"
          for file in stdlib/core/borrow_ranges.atto \
            contracts/atto-core-borrow-ranges-v1.json \
            tests/core-borrow-ranges-source.test.mjs; do
            test -f "$file"
            test ! -L "$file"
            sha="$(git hash-object --no-filters -- "$file")"
            test "$sha" = "$(git rev-parse "HEAD:$file")"
            echo "ATTO_CORE_BORROW_SOURCE_BLOB=$file:$sha"
          done
          test "$(git rev-parse HEAD:contracts/atto-core-borrow-ranges-v1.json)" = \
            a6e35b7605c758559c9bdc094aacde152be7f2c0
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Evaluate pure range/slot source policy with mutation negatives
        run: node --test tests/core-borrow-ranges-source.test.mjs
      - name: Source model must refuse a compiler borrow proof request
        shell: bash
        run: |
          set -euo pipefail
          if ATTO_REQUIRE_COMPILER_GUEST=1 node --test \
            tests/core-borrow-ranges-source.test.mjs > /dev/null 2>&1; then
            echo "::error::a source-only function impersonated compiled ownership" >&2
            exit 1
          fi
          echo "ATTO_CORE_BORROW_COMPILER_PROOF=NOT_EXECUTED"
