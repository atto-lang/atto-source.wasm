name: AttoLang canonical Core import contract (Wasm, source-only)
on:
  pull_request:
    paths:
      - 'contracts/atto-library-core-v1/**'
      - 'tests/atto-library-core-guest.test.mjs'
      - 'docs/ATTO_LIBRARY_WASM_CORE_V1.md'
      - '.github/workflows/atto-library-core-wasm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact head and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "HEAD=$EXPECTED_HEAD TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Run immutable fixture identity test (guest test explicitly skipped)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/atto-library-core-guest.test.mjs
          echo 'ATTO_CANONICAL_CORE_SOURCE=SOURCE_ONLY'
          echo 'ATTO_CANONICAL_CORE_GUEST=NOT_EXECUTED'
