name: Shared actor arena lifecycle v1 source-free parity
on:
  pull_request:
    paths:
      - 'contracts/v1/SHARED_ACTOR_ARENAS_V1.md'
      - 'contracts/v1/actor_arena_lifecycle_v1.json'
      - 'tools/contract_gate.rs'
      - 'tools/actor_arena_receipt.rs'
      - '.github/workflows/actor-arena-lifecycle-v1.yml'
  push:
    paths:
      - 'contracts/v1/SHARED_ACTOR_ARENAS_V1.md'
      - 'contracts/v1/actor_arena_lifecycle_v1.json'
      - 'tools/contract_gate.rs'
      - 'tools/actor_arena_receipt.rs'
      - '.github/workflows/actor-arena-lifecycle-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head and immutable parity blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          test -n "$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git hash-object contracts/v1/SHARED_ACTOR_ARENAS_V1.md)" = "c696c696ff8641e4b12bb7d4aa9cbf70e3002578"
          test "$(git hash-object contracts/v1/actor_arena_lifecycle_v1.json)" = "b0c2f086de90ccf9ee9c36edb6c83732c451e411"
          test "$(git hash-object tools/contract_gate.rs)" = "64b79d867999a54f2321766c51e90936ceaab484"
          test "$(git hash-object tools/actor_arena_receipt.rs)" = "1740366462cd22730f977dfb8726bf8a19e3d985"
      - name: Compile Rust lifecycle verifier and receipt emitter
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings tools/contract_gate.rs -o /tmp/contract-gate
          rustc --edition=2021 -D warnings --test tools/actor_arena_receipt.rs -o /tmp/actor-arena-receipt-tests
          /tmp/actor-arena-receipt-tests
          rustc --edition=2021 -D warnings tools/actor_arena_receipt.rs -o /tmp/actor-arena-receipt
      - name: Execute 40 adversarial actor arena checks in three rounds
        shell: bash
        run: |
          set -euo pipefail
          for round_id in 1 2 3; do
            output="$(/tmp/contract-gate actor-arena-lifecycle .)"
            printf '%s\n' "$output"
            grep -Fq 'checks=40' <<<"$output"
            printf 'ACTOR_ARENA_SOURCEFREE_ROUND_%s_PASS=40\n' "$round_id"
          done
      - name: Emit bounded source-free parity receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          /tmp/actor-arena-receipt "$RUNNER_TEMP/actor-arena-lifecycle-v1.json"
          test -s "$RUNNER_TEMP/actor-arena-lifecycle-v1.json"
      - name: Upload source-free parity receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actor-arena-lifecycle-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actor-arena-lifecycle-v1.json
          if-no-files-found: error
          retention-days: 7
