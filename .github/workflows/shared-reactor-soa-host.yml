name: shared-reactor-soa-host
on:
  push:
    branches: ["feat/shared-reactor-soa-*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-reactor-soa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Reject unsupported shared workers before compiling guest bytes
        run: node --test tests/shared-reactor-policy.test.mjs tests/nio-actor-admission.test.mjs tests/async-io-zero-capability.test.mjs
