name: Actual browser compiler arena policy
on:
  pull_request:
    paths:
      - 'src/**'
      - 'stdlib/policy/**'
      - 'tests/arena-policy*'
      - 'tests/fixtures/arena-*'
      - 'package.json'
      - '.github/workflows/arena-policy-browser-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned public browser compiler
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          root="$RUNNER_TEMP/arena-browser-compiler"
          git init "$root"
          git -C "$root" -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.rs.git 8ef911ab903037699c5d6b047afb180799daa37d
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = 8ef911ab903037699c5d6b047afb180799daa37d
          test "$(git -C "$root" rev-parse HEAD^{tree})" = 5ba6399cbd9523a07dfd744230c6462a262a010f
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          (cd "$root" && cargo +1.85.1 build --locked --release --target wasm32-unknown-unknown --lib)
          compiler="$root/target/wasm32-unknown-unknown/release/atto_compiler.wasm"
          test -s "$compiler"
          printf 'ATTO_BROWSER_SOURCE_ROOT=%s\nATTO_BROWSER_COMPILER=%s\nATTO_BROWSER_COMPILER_SHA256=%s\n' "$root" "$compiler" "$(sha256sum "$compiler" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - name: Execute both real generated guest targets
        env:
          ATTO_ARENA_BROWSER_REQUIRED: '1'
        run: node --test tests/arena-policy-browser-compiler.test.mjs
