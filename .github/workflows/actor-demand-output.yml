name: Wasm actor demand / ACK host admission
on:
  pull_request:
    paths:
      - 'src/runtime/actor-io.mjs'
      - 'src/runtime/actor-demand-output.mjs'
      - 'tests/actor-io-envelope.test.mjs'
      - 'tests/actor-io-owned-byte-accounting.test.mjs'
      - 'tests/actor-io-adversarial-stress.test.mjs'
      - 'tests/actor-io-half-close.test.mjs'
      - 'tests/actor-demand-output.test.mjs'
      - '.github/workflows/actor-demand-output.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-demand-ack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head, tree and actor I/O blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
          git hash-object src/runtime/actor-io.mjs src/runtime/actor-demand-output.mjs \
            tests/actor-io-envelope.test.mjs tests/actor-io-owned-byte-accounting.test.mjs \
            tests/actor-io-adversarial-stress.test.mjs tests/actor-io-half-close.test.mjs \
            tests/actor-demand-output.test.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Exercise genuine Node actor I/O host runtime (not guest/AOT parity)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/actor-io-envelope.test.mjs \
            tests/actor-io-owned-byte-accounting.test.mjs \
            tests/actor-io-adversarial-stress.test.mjs \
            tests/actor-io-half-close.test.mjs \
            tests/actor-demand-output.test.mjs
