name: Wasm pooled supervisor terminal CONTROL host gate

on:
  pull_request:
    paths:
      - 'src/pooled-actor-host.mjs'
      - 'src/supervised-pooled-actor.mjs'
      - 'tests/supervised-pooled-actor-v1.test.mjs'
      - 'package.json'
      - '.github/workflows/wasm-pooled-supervisor-control-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-clang-supervisor-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable source PR head with no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Pin original source HEAD and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(git hash-object tests/supervised-pooled-actor-v1.test.mjs)" = d5ac2e9d5b5dfbc8abc5a96e7b9e9450a5a8f96f
          echo "SUPERVISOR_CONTROL_HEAD=$EXPECTED_HEAD"
          echo "SUPERVISOR_CONTROL_TREE=$(git rev-parse 'HEAD^{tree}')"

      - name: Set up Node.js 22 for actual Worker/Wasm execution
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'

      - name: Install Clang wasm32 native tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld
          node --version
          clang --version | head -n 1

      - name: Execute eight host/Worker integration tests with REAL synthetic Wasm
        shell: bash
        env:
          ATTO_REQUIRE_REAL_SUPERVISOR_GUEST: '0'
          ORESLANG_LLVM_COMPILER: ''
          ORESLANG_LLVM_COMPILER_SHA256: ''
          ORESLANG_LLVM_SOURCE_SHA: ''
          ORESLANG_LLVM_SOURCE_TREE_SHA: ''
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            tests/supervised-pooled-actor-v1.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/atto-wasm-supervisor-host.log"
          grep -Fx '# tests 9' "$RUNNER_TEMP/atto-wasm-supervisor-host.log"
          grep -Fx '# pass 8' "$RUNNER_TEMP/atto-wasm-supervisor-host.log"
          grep -Fx '# skipped 1' "$RUNNER_TEMP/atto-wasm-supervisor-host.log"

      - name: Publish honest exact-head synthetic-Wasm-only receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          log = (root / "atto-wasm-supervisor-host.log").read_text()
          required = ("# tests 9", "# pass 8", "# skipped 1")
          if not all(log.count(s) == 1 for s in required):
              raise SystemExit("host synthetic-Wasm suite inventory did not execute")
          head = subprocess.check_output(("git","rev-parse","HEAD"),text=True).strip()
          tree = subprocess.check_output(("git","rev-parse","HEAD^{tree}"),text=True).strip()
          if head != os.environ["EXPECTED_HEAD"]:
              raise SystemExit("source HEAD changed after tests")
          receipt = {
              "schema":"attolang.wasm.supervisor_control_host_v1",
              "head_sha":head, "tree_sha":tree,
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "node_clang_synthetic_wasm_host_executed":True,
              "host_tests_passed":8, "host_tests_skipped":1,
              "atto_compiler_backed_guest_executed":False,
              "llvm_native_compiler_source_approved":False,
              "real_source_supervisor_restart_proven":False,
              "guest_stale_resume_tickets_proven":False,
              "java_llvm_wasm_full_parity":False
          }
          (root/"atto-wasm-supervisor-host-receipt.json").write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          PY

      - name: Retain host-only exact-head executed evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atto-wasm-supervisor-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/atto-wasm-supervisor-host.log
            ${{ runner.temp }}/atto-wasm-supervisor-host-receipt.json
          if-no-files-found: error
          retention-days: 7
