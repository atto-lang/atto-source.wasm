name: Tenant evidence structure (NOT guest enforcement)
on:
  pull_request:
    paths:
      - 'scripts/verify-tenant-guest-*.mjs'
      - 'tests/tenant-guest-*.test.mjs'
      - 'contracts/two-tenant-guest.v1.json'
      - '.github/workflows/tenant-guest-evidence-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-structural-only:
    name: Offline receipt tests only — NOT tenant containment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Print exact test-tree commit
        run: |
          set -eu
          git rev-parse HEAD
          git status --porcelain
      - name: Execute Node receipt tests (NOT compiled-guest tests)
        run: |
          set -eu
          node --version
          node --test tests/tenant-guest-receipt.test.mjs tests/tenant-guest-evidence.test.mjs
