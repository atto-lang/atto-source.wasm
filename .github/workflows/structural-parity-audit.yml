name: Structural parity contract audit
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-contract-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust unit and adversarial regression tests
        run: cargo test --manifest-path tools/structural-parity-audit/Cargo.toml --all-targets
      - name: Reject omitted cases and evidence inflation (Rust)
        run: cargo run --quiet --manifest-path tools/structural-parity-audit/Cargo.toml -- --self-test
      - name: Verify pinned shared inventory (never guest parity)
        run: cargo run --quiet --manifest-path tools/structural-parity-audit/Cargo.toml -- --check
      - name: Verify release-parity promotion returns the exact intended denial
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(cargo run --quiet --manifest-path tools/structural-parity-audit/Cargo.toml -- --require-parity 2>&1)"
          status=$?
          set -e
          if [[ "$status" -ne 1 ]] ||
             ! grep -Fqx 'STRUCTURAL PARITY AUDIT FAILED: NOT AT PARITY: no independent verified guest runtime evidence' <<< "$output"; then
            printf 'Expected precise inventory-only denial (status=1), received status=%s and output:\n%s\n' "$status" "$output" >&2
            exit 1
          fi
