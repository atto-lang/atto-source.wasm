name: Actor frame-task reconciliation (exact head)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actor-frame-task-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  actor-frame:
    name: exact-head Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA/tree and source purity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          echo "FRAME_TASK_HEAD=$EXPECTED_HEAD"
          echo "FRAME_TASK_TREE=$(git rev-parse 'HEAD^{tree}')"
          git hash-object src/actor-task-lifecycle.mjs src/actor-task-quiescence.mjs \
            src/actor-frame-quiescence.mjs src/pooled-actor-frame-turn.mjs \
            src/pooled-actor-worker.mjs src/pooled-actor-host.mjs \
            src/actor-profile-approval.mjs scripts/actor-frame-profile.mjs
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare real Wasm Clang toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld
          clang --version
      - name: Execute fail-closed task/receipt/profile cases
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            tests/actor-frame-reconciliation.test.mjs \
            tests/actor-frame-profile-admission.test.mjs \
            tests/pooled-actor-task-frame-reconciliation.test.mjs \
            tests/actor-profile-approval.test.mjs | tee /tmp/atto-frame-security.tap
          grep -qx '# fail 0' /tmp/atto-frame-security.tap
          grep -qx '# skipped 0' /tmp/atto-frame-security.tap
      - name: Execute real Wasm pooled actor and arena regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            tests/pooled-actors.test.mjs tests/actor-arena.test.mjs \
            | tee /tmp/atto-pooled-worker.tap
          grep -qx '# fail 0' /tmp/atto-pooled-worker.tap
          grep -qx '# skipped 0' /tmp/atto-pooled-worker.tap
      - name: Run full repository Node 22 suite
        if: matrix.node == '22'
        run: npm test
      - name: Explicit non-certification
        run: |
          echo "FRAME_TASK_NODE_EXECUTED=true"
          echo "NATIVE_ATTO_COMPILER_PROFILE_GUEST=NOT_EXECUTED"
          echo "RUST_WASMTIME_AOT=NOT_EXECUTED"
          echo "TENANTVM_HOSTILE_ISOLATION=NOT_CERTIFIED"
