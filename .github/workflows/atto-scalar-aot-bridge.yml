name: Strict AttoLang scalar source AOT bridge admission
on:
  pull_request:
    paths:
      - 'tools/atto_scalar_aot.py'
      - 'tests/test_atto_scalar_aot_bridge.py'
      - 'fixtures/scalar-seven.atto'
      - 'aot-host/precompile/src/wasm_admission.rs'
      - '.github/workflows/atto-scalar-aot-bridge.yml'
  push:
    paths:
      - 'tools/atto_scalar_aot.py'
      - 'tests/test_atto_scalar_aot_bridge.py'
      - 'fixtures/scalar-seven.atto'
      - 'aot-host/precompile/src/wasm_admission.rs'
      - '.github/workflows/atto-scalar-aot-bridge.yml'
permissions:
  contents: read
jobs:
  source-admission-negatives:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --quiet HEAD --
      - name: Compile bridge Python and execute ten negative controls
        run: |
          python3 -m py_compile tools/atto_scalar_aot.py
          python3 -m unittest discover -s tests -p 'test_atto_scalar_aot_bridge.py' -v
      - name: Evidence boundary
        run: echo 'NEGATIVE_ADMISSION_TESTS_ONLY_NO_ATTO_COMPILER_GUEST_COMPILED'
