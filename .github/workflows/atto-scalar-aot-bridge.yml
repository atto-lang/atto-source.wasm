name: Strict AttoLang scalar source AOT bridge admission
on:
  pull_request:
    paths:
      - 'tools/atto_scalar_aot.mjs'
      - 'tests/scalar-bridge-negatives.test.mjs'
      - 'fixtures/scalar-seven.atto'
      - 'aot-host/precompile/src/wasm_admission.rs'
      - '.github/workflows/atto-scalar-aot-bridge.yml'
  push:
    paths:
      - 'tools/atto_scalar_aot.mjs'
      - 'tests/scalar-bridge-negatives.test.mjs'
      - 'fixtures/scalar-seven.atto'
      - 'aot-host/precompile/src/wasm_admission.rs'
      - '.github/workflows/atto-scalar-aot-bridge.yml'
permissions:
  contents: read
jobs:
  source-admission-negatives:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --quiet HEAD --
      - name: Install supported Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute ten bridge negative controls without Python
        run: node --test tests/scalar-bridge-negatives.test.mjs
      - name: Evidence boundary
        run: echo 'NEGATIVE_ADMISSION_TESTS_ONLY_NO_ATTO_COMPILER_GUEST_COMPILED'
