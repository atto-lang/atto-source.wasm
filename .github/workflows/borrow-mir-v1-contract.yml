name: Borrow MIR V1 contract (source-free only)
on:
  pull_request:
    paths:
      - "contracts/borrow-mir-v1/**"
      - "tests/borrow-mir-v1-contract.test.mjs"
      - ".github/workflows/borrow-mir-v1-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact contract blobs and source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          # Check cleanliness before producing untracked evidence files.
          test -z "$(git status --porcelain)"
          mkdir -p target/borrow-mir-v1-evidence
          git rev-parse HEAD > target/borrow-mir-v1-evidence/head.txt
          git rev-parse "HEAD^{tree}" > target/borrow-mir-v1-evidence/root-tree.txt
          printf "status=HOST_ONLY\n" > target/borrow-mir-v1-evidence/status.txt
          test "$(git rev-parse HEAD:contracts/borrow-mir-v1/semantic-cases.json)" = "f1be361c2e68cfe7274d821ef93ca9767ba09bec"
          test "$(git rev-parse HEAD:tests/borrow-mir-v1-contract.test.mjs)" = "6d52d2dafc407cb365f6aaa957039852516afeac"
          test "$(git rev-parse HEAD:contracts/borrow-mir-v1/README.md)" = "5c90ba56cf022a8512da0c0174723a546fdc1618"
          test "$(git rev-parse HEAD:contracts/borrow-mir-v1/semantic-cases.json)" = "$(git hash-object --no-filters contracts/borrow-mir-v1/semantic-cases.json)"
          test "$(git rev-parse HEAD:tests/borrow-mir-v1-contract.test.mjs)" = "$(git hash-object --no-filters tests/borrow-mir-v1-contract.test.mjs)"
          test "$(git rev-parse HEAD:contracts/borrow-mir-v1/README.md)" = "$(git hash-object --no-filters contracts/borrow-mir-v1/README.md)"
      - name: Install pinned Node.js 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Execute source-free fixture contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee target/borrow-mir-v1-evidence/node-version.txt
          node --test tests/borrow-mir-v1-contract.test.mjs | tee target/borrow-mir-v1-evidence/host-contract.log
          echo NO_COMPILER_GUEST_OR_BACKEND_PARITY_CERTIFICATION >> target/borrow-mir-v1-evidence/status.txt
      - name: Preserve noncertifying host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: borrow-mir-v1-HOST-ONLY-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/borrow-mir-v1-evidence/
          if-no-files-found: warn
          retention-days: 7
