name: Wasmtime AOT draft checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "aot-host/**"
      - "scripts/**"
      - "src/**"
      - "contracts/**"
      - "tests/**"
      - "examples/**"
      - "package.json"
      - "rust-toolchain.toml"
      - ".github/workflows/aot-host.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-aot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Bind to reviewed PR head, never the synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head and indexed Git tree before AOT execution
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$(git cat-file -t "$SOURCE_TREE")" = tree
          # Untrusted .gitattributes clean filters can execute in git diff/status.
          # Git write-tree compares the index to the exact tree without filters.
          test "$(git write-tree)" = "$SOURCE_TREE"
          test -z "$(git ls-files --others --exclude-standard)"
          echo "WASM_AOT_SOURCE_COMMIT=$EXPECTED_HEAD"
          echo "WASM_AOT_SOURCE_TREE=$SOURCE_TREE"
      - name: Set up pinned Node 22 for architecture assertions
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Assert fail-closed AOT build gates and CI coverage
        run: node --test tests/aot-architecture.test.mjs tests/real-aot-gate.test.mjs
      - name: Install Wasmtime 49 compatible Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Inspect pinned toolchain
        run: rustc --version && cargo --version && rustup show active-toolchain
      - name: Build trusted AOT precompiler
        run: cargo test --locked --manifest-path aot-host/precompile/Cargo.toml
      - name: Build compiler-free AOT runner
        run: cargo check --locked --manifest-path aot-host/run/Cargo.toml
      - name: Assert native runtime dependency tree contains no Wasm compiler
        shell: bash
        run: |
          cargo tree --locked --manifest-path aot-host/run/Cargo.toml --features insecure-dev-caller-pin > runtime-tree.txt
          if grep -E 'wasmtime(-internal)?-(cranelift|winch)' runtime-tree.txt; then
            echo "runtime is not compiler-free" >&2
            exit 1
          fi
      - name: Install LLVM wasm32 linker
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Run full WebAssembly scalar and shared-contract suite
        run: npm test
      - name: Run strict AOT scalar smoke and tamper rejection
        run: bash aot-host/tests/smoke.sh
