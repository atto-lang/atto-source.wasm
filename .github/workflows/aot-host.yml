name: Wasmtime AOT draft checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "aot-host/**"
      - "scripts/**"
      - "src/**"
      - "contracts/**"
      - "tests/**"
      - "examples/**"
      - "package.json"
      - "rust-toolchain.toml"
      - ".github/workflows/aot-host.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-aot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Bind to reviewed PR head, never the synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head and clean checkout before AOT execution
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          echo "WASM_AOT_SOURCE_COMMIT=$EXPECTED_HEAD"
          echo "WASM_AOT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Set up pinned Node 22 for architecture assertions
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Assert fail-closed AOT build gates and CI coverage
        run: node --test tests/aot-architecture.test.mjs tests/real-aot-gate.test.mjs
      - name: Mutation-test pinned LLVM compiler receipt consumer
        run: node --test tests/llvm-compiler-handoff.test.mjs
      - name: Prove LLVM build source pin and transfer policy fail closed
        run: node --test tests/pinned-llvm-build-policy.test.mjs
      - name: Preflight reviewed LLVM source commit and root tree
        run: bash scripts/build-pinned-llvm-compiler.sh --preflight
      - name: Install LLVM compiler build toolchain after source admission
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang lld llvm-dev python3
      - name: Build pinned LLVM compiler from preapproved local source
        # Does not fetch source or enable GitHub private-repository sharing.
        # Without a previously authorized checkout this fails NOT_EXECUTED.
        run: bash scripts/build-pinned-llvm-compiler.sh
      - name: Require approved LLVM build handoff before expensive AOT work
        # Requires an independently authorized, already-present source checkout
        # and compiler build receipt. No private cross-repository fetch or export.
        run: node scripts/verify-llvm-compiler-handoff.mjs
      - name: Install Wasmtime 49 compatible Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Inspect pinned toolchain
        run: rustc --version && cargo --version && rustup show active-toolchain
      - name: Build trusted AOT precompiler
        run: cargo test --locked --manifest-path aot-host/precompile/Cargo.toml
      - name: Build compiler-free AOT runner
        run: cargo check --locked --manifest-path aot-host/run/Cargo.toml
      - name: Assert native runtime dependency tree contains no Wasm compiler
        shell: bash
        run: |
          cargo tree --locked --manifest-path aot-host/run/Cargo.toml --features insecure-dev-caller-pin > runtime-tree.txt
          if grep -E 'wasmtime(-internal)?-(cranelift|winch)' runtime-tree.txt; then
            echo "runtime is not compiler-free" >&2
            exit 1
          fi
      - name: Install LLVM wasm32 linker
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Run full WebAssembly scalar and shared-contract suite
        run: npm test
      - name: Require real Oreslang source actor execution
        # Fail closed: ordinary npm test may skip compiler-dependent cases.
        # This job is not green until an independently pinned LLVM compiler
        # (binary SHA + source commit + source tree) is provisioned.
        run: npm run test:real-pooled-actors
      - name: Run strict AOT scalar smoke and tamper rejection
        run: bash aot-host/tests/smoke.sh
